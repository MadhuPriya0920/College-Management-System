
apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-app
  namespace: madhu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: college-app
  template:
    metadata:
      labels:
        app: college-app
    spec:
      containers:
        - name: app
          image: madhupriyakb/college-management-system:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: college-app-service
  namespace: madhu
spec:
  type: NodePort
  selector:
    app: college-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
